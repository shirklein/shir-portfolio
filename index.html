  <script>
    var heroEl = document.querySelector('.hero');
    var nameHeading = document.querySelector('h1');
    var nameLink = nameHeading ? nameHeading.querySelector('a') : null;

    var fitHeadingToWidth = function(){
      if(!nameHeading || !nameLink) return;
      if(document.body.classList.contains('scrolled') || window.innerWidth <= 640){
        nameHeading.style.fontSize = '';
        return;
      }
      nameHeading.style.fontSize = '';
      var basePx = parseFloat(getComputedStyle(nameHeading).fontSize);
      var naturalWidth = nameLink.getBoundingClientRect().width;
      var leftPx = parseFloat(getComputedStyle(nameHeading).left) || 0;
      var available = window.innerWidth - (leftPx * 2);
      if(naturalWidth > 0 && available > 0){
        nameHeading.style.fontSize = (basePx * (available / naturalWidth)) + 'px';
      }
    };

    var syncHeroOffset = function(){
      if(!heroEl || !nameHeading) return;
      heroEl.style.marginTop = '';
      if(window.innerWidth <= 640) return;
      var baseMarginPx = parseFloat(getComputedStyle(heroEl).marginTop) || 0;
      var heroTop = heroEl.getBoundingClientRect().top;
      var naturalTop = heroTop - baseMarginPx;
      var headingBottom = nameHeading.getBoundingClientRect().bottom;
      var gap = 0;
      var required = headingBottom + gap - naturalTop;
      heroEl.style.marginTop = Math.max(baseMarginPx, required) + 'px';
    };

    var syncHeading = function(){
      fitHeadingToWidth();
      syncHeroOffset();
    };
    syncHeading();
    window.addEventListener('resize', syncHeading);
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(syncHeading);
    }

    var toggleScrolled = function(){
      document.body.classList.toggle('scrolled', window.scrollY > 20);
      fitHeadingToWidth();
    };
    window.addEventListener('scroll', toggleScrolled);
    toggleScrolled();

    var projectRow = document.querySelector('.project-grid--single-row');
    if(projectRow){
      projectRow.scrollLeft = (projectRow.scrollWidth - projectRow.clientWidth) / 2;

      window.addEventListener('wheel', function(e){
        var delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        var maxScroll = projectRow.scrollWidth - projectRow.clientWidth;
        var atStart = projectRow.scrollLeft <= 0;
        var atEnd = projectRow.scrollLeft >= maxScroll;
        if((delta < 0 && atStart) || (delta > 0 && atEnd)) return;
        e.preventDefault();
        projectRow.scrollLeft += delta;
      }, { passive: false });
    }

    var projectCards = Array.from(document.querySelectorAll('.project-card'));
    projectCards.forEach(function(card){
      card.addEventListener('mouseenter', function(){
        projectCards.forEach(function(c){
          var v = c.querySelector('video');
          if(!v) return;
          if(c === card){ v.play().catch(function(){}); }
          else { v.pause(); }
        });
      });
      card.addEventListener('mouseleave', function(){
        projectCards.forEach(function(c){
          var v = c.querySelector('video');
          if(v) v.play().catch(function(){});
        });
      });
    });
  </script>
